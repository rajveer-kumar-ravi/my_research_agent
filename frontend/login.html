<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Research Agent — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="card auth-card">

      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">WR</span>
        <div class="brand-text">
          <strong>Web Research Agent</strong>
          <span>EVIDENCE SYNTHESIS</span>
        </div>
      </div>

      <div class="auth-error" id="authError" role="alert"></div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" id="tabSignIn" role="tab" aria-selected="true">Sign In</button>
        <button type="button" class="auth-tab" id="tabCreateAccount" role="tab" aria-selected="false">Create Account</button>
      </div>

      <!-- Sign In panel -->
      <div class="auth-panel is-active" id="panelSignIn">
        <form id="signInForm" novalidate>
          <div class="auth-field">
            <label for="signInEmail">Email</label>
            <input type="email" id="signInEmail" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label for="signInPassword">Password</label>
            <input type="password" id="signInPassword" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="signInSubmit">
            <span id="signInSubmitText">Sign In</span>
          </button>
        </form>
      </div>

      <!-- Create Account panel -->
      <div class="auth-panel" id="panelCreateAccount">
        <form id="createAccountForm" novalidate>
          <div class="auth-field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" autocomplete="name" required />
          </div>
          <div class="auth-field">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" autocomplete="new-password" required minlength="8" />
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8" />
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="createAccountSubmit">
            <span id="createAccountSubmitText">Create Account</span>
          </button>
        </form>
      </div>

      <div class="auth-divider">or</div>

      <button type="button" class="btn google-btn" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
